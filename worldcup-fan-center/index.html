<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界杯球迷中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="main-nav">
    <ul class="nav-list">
      <li><a href="#dashboard" class="nav-link active" data-section="dashboard">仪表盘</a></li>
      <li><a href="#schedule" class="nav-link" data-section="schedule">赛程</a></li>
      <li><a href="#teams" class="nav-link" data-section="teams">球队</a></li>
      <li><a href="#standings" class="nav-link" data-section="standings">积分对阵</a></li>
      <li><a href="#predictions" class="nav-link" data-section="predictions">预测</a></li>
      <li><a href="#history" class="nav-link" data-section="history">历史</a></li>
      <li><a href="#community" class="nav-link" data-section="community">社区</a></li>
      <li><a href="#settings" class="nav-link" data-section="settings">设置</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <!-- ========== 仪表盘模块 ========== -->
    <section id="dashboard">
      <h2>仪表盘</h2>
      <div class="dashboard-grid">
        <!-- 左侧 35% -->
        <div class="dashboard-left">
          <!-- 主队信息卡 -->
          <div class="team-card module-container" id="team-card">
            <h3 class="team-card__title">我的主队</h3>
            <div class="team-card__body" id="team-card-body">
              <p class="team-card__placeholder">加载中...</p>
            </div>
          </div>
          <!-- 球迷时区表 -->
          <div class="timezone-strip module-container" id="timezone-strip">
            <h3 class="timezone-strip__title">球迷时区表</h3>
            <div class="timezone-list" id="timezone-list">
              <!-- 由 dashboard.js 动态渲染 -->
            </div>
          </div>
        </div>
        <!-- 右侧 65% -->
        <div class="dashboard-right">
          <!-- 场馆地图 -->
          <div class="venue-map module-container" id="venue-map">
            <h3 class="venue-map__title">2026 美加墨世界杯场馆分布</h3>
            <div class="map-canvas" id="map-canvas">
              <!-- 三国轮廓 + 城市圆点由 dashboard.js 动态渲染 -->
            </div>
          </div>
          <!-- 倒计时（保持现有，由 countdown.js 渲染） -->
          <div id="countdown">
            <!-- 由 countdown.js 动态渲染 -->
          </div>
        </div>
      </div>
    </section>

    <!-- 赛程模块 -->
    <section id="schedule" style="display: none;">
      <h2>赛程</h2>
      <div class="module-container">
        <!-- 后续放入：比赛赛程列表、日期筛选、赛事详情等 -->
      </div>
    </section>

    <!-- 球队模块 -->
    <section id="teams" style="display: none;">
      <h2>球队</h2>
      <div class="module-container">
        <!-- 后续放入：球队列表、球员信息、球队数据统计等 -->
      </div>
    </section>

    <!-- 积分对阵模块 -->
    <section id="standings" style="display: none;">
      <h2>积分对阵</h2>
      <div class="module-container">
        <!-- 后续放入：小组积分表、淘汰赛对阵图等 -->
      </div>
    </section>

    <!-- 预测模块 -->
    <section id="predictions" style="display: none;">
      <h2>预测</h2>
      <div class="module-container">
        <!-- 后续放入：比赛结果预测、数据分析、投票等 -->
      </div>
    </section>

    <!-- 历史模块 -->
    <section id="history" style="display: none;">
      <h2>历史</h2>
      <div class="module-container">
        <!-- 后续放入：历届世界杯数据、经典回顾、纪录等 -->
      </div>
    </section>

    <!-- 社区模块 -->
    <section id="community" style="display: none;">
      <h2>社区</h2>
      <div class="module-container">
        <!-- 后续放入：球迷讨论区、帖子列表、热评等 -->
      </div>
    </section>

    <!-- 设置模块 -->
    <section id="settings" style="display: none;">
      <h2>设置</h2>
      <div class="module-container">
        <!-- ========== 控制组1：日/夜模式 ========== -->
        <div class="settings-group">
          <div class="settings-group__header">
            <h3>外观主题</h3>
          </div>
          <p class="settings-group__desc">切换日间/夜间显示模式</p>
          <div class="settings-group__controls">
            <button id="theme-toggle-btn" class="btn btn--primary" type="button">
              <span id="theme-toggle-text">切换为夜间模式</span>
            </button>
            <label class="checkbox-label" title="跟随操作系统明暗模式自动切换">
              <input type="checkbox" id="theme-auto-checkbox">
              跟随系统自动切换
            </label>
          </div>
        </div>
        <!-- ========== 控制组2：字体大小 ========== -->
        <div class="settings-group">
          <div class="settings-group__header">
            <h3>字体大小</h3>
          </div>
          <p class="settings-group__desc">调整页面文字显示大小</p>
          <div class="settings-group__controls font-controls">
            <button id="font-decrease" class="btn btn--icon" type="button" title="减小字体">A&#8722;</button>
            <span id="font-size-label" class="font-size-label">中</span>
            <button id="font-increase" class="btn btn--icon" type="button" title="增大字体">A+</button>
          </div>
        </div>
        <!-- ========== 控制组3：主队选择 ========== -->
        <div class="settings-group">
          <div class="settings-group__header">
            <h3>我的主队</h3>
          </div>
          <p class="settings-group__desc">选择你最支持的球队，将在仪表盘中高亮</p>
          <div class="settings-group__controls">
            <select id="favorite-team-select" class="select-input">
              <option value="">-- 请选择主队 --</option>
            </select>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
