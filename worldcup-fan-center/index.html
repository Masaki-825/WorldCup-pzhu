<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界杯球迷中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="main-nav">
    <ul class="nav-list">
      <li><a href="#dashboard" class="nav-link active" data-section="dashboard">仪表盘</a></li>
      <li><a href="#schedule" class="nav-link" data-section="schedule">赛程</a></li>
      <li><a href="#teams" class="nav-link" data-section="teams">球队</a></li>
      <li><a href="#standings" class="nav-link" data-section="standings">积分对阵</a></li>
      <li><a href="#predictions" class="nav-link" data-section="predictions">预测</a></li>
      <li><a href="#history" class="nav-link" data-section="history">历史</a></li>
      <li><a href="#community" class="nav-link" data-section="community">社区</a></li>
      <li><a href="#settings" class="nav-link" data-section="settings">设置</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <!-- 仪表盘模块 -->
    <section id="dashboard">
      <h2>仪表盘</h2>
      <div class="module-container">
        <!-- 后续放入：赛事概览卡片、实时比分、热门新闻聚合等 -->
        <div id="countdown">
          <!-- 倒计时由 countdown.js 动态渲染 -->
        </div>
      </div>
    </section>

    <!-- 赛程模块 -->
    <section id="schedule" style="display: none;">
      <h2>赛程</h2>
      <div class="module-container">
        <!-- 后续放入：比赛赛程列表、日期筛选、赛事详情等 -->
      </div>
    </section>

    <!-- 球队模块 -->
    <section id="teams" style="display: none;">
      <h2>球队</h2>
      <div class="module-container">
        <!-- 后续放入：球队列表、球员信息、球队数据统计等 -->
      </div>
    </section>

    <!-- 积分对阵模块 -->
    <section id="standings" style="display: none;">
      <h2>积分对阵</h2>
      <div class="module-container">
        <!-- 后续放入：小组积分表、淘汰赛对阵图等 -->
      </div>
    </section>

    <!-- 预测模块 -->
    <section id="predictions" style="display: none;">
      <h2>预测</h2>
      <div class="module-container">
        <!-- 后续放入：比赛结果预测、数据分析、投票等 -->
      </div>
    </section>

    <!-- 历史模块 -->
    <section id="history" style="display: none;">
      <h2>历史</h2>
      <div class="module-container">
        <!-- 后续放入：历届世界杯数据、经典回顾、纪录等 -->
      </div>
    </section>

    <!-- 社区模块 -->
    <section id="community" style="display: none;">
      <h2>社区</h2>
      <div class="module-container">
        <!-- 后续放入：球迷讨论区、帖子列表、热评等 -->
      </div>
    </section>

    <!-- 设置模块 -->
    <section id="settings" style="display: none;">
      <h2>设置</h2>
      <div class="module-container">
        <!-- 后续放入：主题切换、语言设置、通知偏好等 -->
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
